<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Campus OS" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#F8FAFC" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#060911" media="(prefers-color-scheme: dark)" />
    <title>Campus OS</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/jpeg" href="/campus_os_icon.jpg" />
    <link rel="apple-touch-icon" href="/campus_os_icon.jpg" />
    <script>
      (function() {
        try {
          var orig = window.fetch;
          var stored = orig;
          var targets = [
            typeof Window !== 'undefined' && Window.prototype,
            window
          ];
          targets.forEach(function(t) {
            if (!t) return;
            try {
              Object.defineProperty(t, 'fetch', {
                get: function() {
                  return stored || orig;
                },
                set: function(val) {
                  stored = val;
                },
                configurable: true,
                enumerable: true
              });
            } catch(e) {}
          });
        } catch(err) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
